configuration:
  default_visibility:
    name: Default visibility
    description: >-
      Visibility given to a new copy when the form leaves it alone. "shared"
      shows the copy to every Home Assistant user; "private" shows it only to
      the owner of that copy.
  log_level:
    name: Log level
    description: >-
      How much the add-on writes to the Supervisor log. "debug" is very noisy
      and is only useful while something is being fixed.
  films_path:
    name: Ripped films folder
    description: >-
      Optional. A folder inside the media share (one folder per film) imported
      on every start, so a newly ripped disc appears without anyone typing a
      path. Leave it empty to import by hand instead.
  films_owner:
    name: Whose films those are
    description: >-
      The display name of the person who owns the copies films_path imports.
      Ignored when films_path is empty.
  refresh_hours:
    name: Automatic metadata pass
    description: >-
      How often the catalogue looks up metadata nobody has asked for yet -
      posters, plots, artist biographies and the film series that fill the
      collections - without anyone pressing a button. 24 is daily, 168 is
      weekly, 0 turns it off. A bounded handful is also looked up every time
      the add-on starts, however this is set.
