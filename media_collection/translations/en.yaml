configuration:
  default_visibility:
    name: Default visibility
    description: >-
      Visibility given to a new copy when the form leaves it alone. "shared"
      shows the copy to every Home Assistant user; "private" shows it only to
      the owner of that copy.
  log_level:
    name: Log level
    description: >-
      How much the add-on writes to the Supervisor log. "debug" is very noisy
      and is only useful while something is being fixed.
