configuration:
  default_visibility:
    name: Default visibility
    description: >-
      Visibility given to a new copy when the form leaves it alone. "shared"
      shows the copy to every Home Assistant user; "private" shows it only to
      the owner of that copy.
  log_level:
    name: Log level
    description: >-
      How much the add-on writes to the Supervisor log. "debug" is very noisy
      and is only useful while something is being fixed.
  refresh_hours:
    name: Automatic metadata pass
    description: >-
      How often the catalogue looks up metadata nobody has asked for yet -
      posters, plots, artist biographies and the film series that fill the
      collections - without anyone pressing a button. 24 is daily, 168 is
      weekly, 0 turns it off. A bounded handful is also looked up every time
      the add-on starts, however this is set.
  refresh_time:
    name: Time of the automatic pass
    description: >-
      The time of day the automatic metadata pass runs, as HH:MM on the clock
      the app takes from Home Assistant - "03:00" by default. Move it if
      something else on the network is busy then, such as a router that
      restarts at 3 am. Used when the pass is set to daily or weekly; every
      other interval counts from the run instead.
  refresh_retry_minutes:
    name: Retry a pass that wrote nothing
    description: >-
      Minutes to wait before trying an automatic pass again when it managed to
      look nothing up - usually a network that was still down, which is what a
      router restarting at 3 am looks like. 30 is the default; 0 never retries
      and leaves the backlog for the next scheduled pass.
